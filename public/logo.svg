<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="econo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="econo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek Dark Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#0A0D14" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Internal Glow Accent -->
  <circle cx="48" cy="16" r="12" fill="#FF3B30" opacity="0.15" filter="url(#glow)" />
  
  <!-- Geometric 'E' Construction with Upward Growth Vector -->
  <!-- Top bar -->
  <path d="M18 16 H44 V21 H24 V27 H38 V32 H24 V38 H44 V43 H18 Z" fill="url(#econo-grad)" />
  
  <!-- Financial Upward Dynamic Arrow Accent -->
  <path d="M30 38 L42 26 L46 30 L46 22 L38 22 L42 26" stroke="url(#econo-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
